{% extends 'rentals/base.html' %}
{% load static %}

{% block title %}VIP Member Login | RENTORA Kerala{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-5 py-16">
  <div class="bg-[#181614] text-white p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/10 text-center space-y-6">
    
    <div>
      <div class="w-14 h-14 bg-amber-500/20 text-amber-400 rounded-2xl mx-auto flex items-center justify-center text-xl mb-4 border border-amber-500/30">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="font-display text-3xl font-medium text-white">VIP Member Portal</h1>
      <p class="text-xs uppercase tracking-widest text-amber-400 mt-1 font-semibold">Confidential Residence Access</p>
    </div>

    <form method="POST" action="{% url 'login' %}" class="space-y-4 text-left">
      {% csrf_token %}
      
      <div>
        <label class="block text-[0.65rem] uppercase tracking-widest text-white/60 mb-1 font-semibold">Username or Email</label>
        <input required type="text" name="username" placeholder="alexander@example.com" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-amber-400 transition" />
      </div>

      <div>
        <label class="block text-[0.65rem] uppercase tracking-widest text-white/60 mb-1 font-semibold">Password</label>
        <input required type="password" name="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-amber-400 transition" />
      </div>

      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-black font-display text-xs uppercase tracking-widest rounded-xl font-bold hover:brightness-110 transition shadow-lg mt-2">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Member Portal
      </button>
    </form>

    <div class="pt-4 border-t border-white/10 text-xs text-white/60 flex flex-col gap-2">
      <p>Not a member yet? <a href="{% url 'register' %}" class="text-amber-400 font-semibold hover:underline">Apply for Member Circle</a></p>
      <p><a href="{% url 'resend_verification' %}" class="text-white/40 hover:text-white transition">Resend Verification Email</a></p>
    </div>

  </div>
</div>
{% endblock %}
