{% extends 'rentals/base.html' %}
{% load static %}

{% block title %}Join Member Circle | RENTORA Kerala{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-5 py-14">
  <div class="bg-[#181614] text-white p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/10 text-center space-y-6">
    
    <div>
      <div class="w-14 h-14 bg-white/10 text-white rounded-2xl mx-auto flex items-center justify-center text-xl mb-4 border border-white/20">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 class="font-display text-3xl font-medium text-white">Join Member Circle</h1>
      <p class="text-xs uppercase tracking-widest text-white/70 mt-1 font-semibold">Private Estates &amp; Off-Market Access</p>
    </div>

    <form method="POST" action="{% url 'register' %}" class="space-y-4 text-left">
      {% csrf_token %}
      
      <div>
        <label class="block text-[0.65rem] uppercase tracking-widest text-white/60 mb-1 font-semibold">Username</label>
        <input required type="text" name="username" placeholder="alexander_villas" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-white/50 transition" />
      </div>

      <div>
        <label class="block text-[0.65rem] uppercase tracking-widest text-white/60 mb-1 font-semibold">Email Address</label>
        <input required type="email" name="email" placeholder="alexander@example.com" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-white/50 transition" />
      </div>

      <div>
        <label class="block text-[0.65rem] uppercase tracking-widest text-white/60 mb-1 font-semibold">Password</label>
        <input required type="password" name="password1" placeholder="••••••••" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-white/50 transition" />
      </div>

      <div>
        <label class="block text-[0.65rem] uppercase tracking-widest text-white/60 mb-1 font-semibold">Confirm Password</label>
        <input required type="password" name="password2" placeholder="••••••••" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-white/50 transition" />
      </div>

      <button type="submit" class="w-full py-3.5 bg-white text-[#181614] font-display text-xs uppercase tracking-widest rounded-xl font-bold hover:bg-slate-200 transition shadow-lg mt-2">
        <i class="fa-solid fa-paper-plane me-1"></i> Register &amp; Dispatch Verification
      </button>
    </form>

    <div class="pt-4 border-t border-white/10 text-xs text-white/60">
      <p>Already a member? <a href="{% url 'login' %}" class="text-white font-semibold hover:underline">Sign In Here</a></p>
    </div>

  </div>
</div>
{% endblock %}
